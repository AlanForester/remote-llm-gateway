apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspaces
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: gateway
          image: ghcr.io/alanforester/remote-llm-gateway/gateway:main
          ports:
            - containerPort: 8080
          env:
            - name: GATEWAY_ADDR
              value: ":8080"
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: WORKSPACES_DIR
              value: /data/workspaces
            - name: GATEWAY_ECHO
              value: "1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: remote-llm
                  key: OPENAI_API_KEY
                  optional: true
            - name: OUTBOUND_PROXY
              valueFrom:
                secretKeyRef:
                  name: remote-llm
                  key: OUTBOUND_PROXY
                  optional: true
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          volumeMounts:
            - name: workspaces
              mountPath: /data/workspaces
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: workspaces
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/alanforester/remote-llm-gateway/api:main
          ports:
            - containerPort: 8082
          env:
            - name: API_ADDR
              value: ":8082"
            - name: REDIS_URL
              value: redis://redis:6379/0
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: ghcr.io/alanforester/remote-llm-gateway/admin:main
          ports:
            - containerPort: 8081
          env:
            - name: ADMIN_ADDR
              value: ":8081"
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-llm
                  key: ADMIN_TOKEN
            - name: OUTBOUND_PROXY
              valueFrom:
                secretKeyRef:
                  name: remote-llm
                  key: OUTBOUND_PROXY
                  optional: true
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: admin
spec:
  selector:
    app: admin
  ports:
    - port: 8081
      targetPort: 8081
