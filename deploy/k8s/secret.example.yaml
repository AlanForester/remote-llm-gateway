# Пример. В kustomization этот файл не входит.
# Создайте секрет сами и подставьте свои значения:
#
#   kubectl -n remote-llm create secret generic remote-llm \
#     --from-literal=ADMIN_TOKEN=... \
#     --from-literal=OPENAI_API_KEY=... \
#     --from-literal=OUTBOUND_PROXY= \
#     --from-literal=GRAFANA_ADMIN_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: remote-llm
  namespace: remote-llm
type: Opaque
stringData:
  ADMIN_TOKEN: change-me
  OPENAI_API_KEY: ""
  OUTBOUND_PROXY: ""
  GRAFANA_ADMIN_PASSWORD: change-me
