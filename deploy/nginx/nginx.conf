# Один вход для шлюза, админки и API.
# Сервисы слушают localhost, снаружи открыт только nginx.
#
#   GATEWAY_ADDR=127.0.0.1:8080
#   ADMIN_ADDR=127.0.0.1:8081
#   API_ADDR=127.0.0.1:8082
#
# Проверка: nginx -t -c /путь/к/deploy/nginx/nginx.conf
# На сервере этот файл можно положить как /etc/nginx/nginx.conf
# или вырезать блок server в sites-enabled. Директива map должна
# остаться в контексте http.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx-remote-llm.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Адреса процессов на той же машине. В docker-сети замените на имена сервисов.
    upstream gateway_upstream {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    upstream admin_upstream {
        server 127.0.0.1:8081;
    }

    upstream api_upstream {
        server 127.0.0.1:8082;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # listen 443 ssl;
        # listen [::]:443 ssl;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;

        client_max_body_size 32m;

        # ACP: WebSocket шлюза.
        location /ws/ {
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
            proxy_buffering off;
        }

        # Сессии и профиль клиента. Плагин и remote-llm ходят сюда.
        location /v1/ {
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Отдельный API. /api/v1/me и /api/health снаружи, внутри без префикса /api.
        location /api/ {
            proxy_pass http://api_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://gateway_upstream/health;
        }

        location = /health/admin {
            proxy_pass http://admin_upstream/health;
        }

        location = /health/api {
            proxy_pass http://api_upstream/health;
        }

        # Админка: /, /login, /users, /proxy.
        location / {
            proxy_pass http://admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
